name: Frontend validation (draft PR)
on:
  push:
    branches:
      - feature/openai-ads-registration-tracking
  pull_request:
    branches:
      - main
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Unit tests
        env:
          CI: 'true'
        run: npm test -- --watch=false --runInBand
      - name: Production build
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: https://example.invalid
        run: npm run build
