name: Release security validation (draft PR)

on:
  pull_request:
    branches: [main, release/emergent-current]
    paths:
      - "backend/server.py"
      - "backend/test_paypal_*.py"
      - "backend/test_payment_mongo_integration.py"
      - "frontend/**"
      - ".github/workflows/release-security-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-mongo:
    name: Payment transactions (isolated MongoDB replica set)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test driver
        run: python -m pip install motor==3.7.1 pymongo==4.13.2
      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name release-mongo -p 127.0.0.1:27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec release-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec release-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          python - <<'PY'
          import time
          from pymongo import MongoClient
          c = MongoClient('mongodb://127.0.0.1:27017/?replicaSet=rs0', serverSelectionTimeoutMS=1000)
          for _ in range(30):
              try:
                  if c.admin.command('hello').get('isWritablePrimary'): break
              except Exception: pass
              time.sleep(1)
          else: raise SystemExit('MongoDB primary not ready')
          c.close()
          PY
      - name: Concurrent grants, deduplication and rollback
        run: python -m unittest -v backend.test_payment_mongo_integration
      - name: Remove disposable MongoDB
        if: always()
        run: docker rm -f release-mongo || true

  paypal-security:
    name: PayPal security regression (isolated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend syntax
        run: python -m py_compile backend/server.py
      - name: Focused PayPal policy and ownership tests
        run: python -m unittest -v backend.test_paypal_sale_policy backend.test_paypal_subscription_claim

  frontend-build:
    name: Frontend production build (no deploy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies without altering repository
        run: npm install --legacy-peer-deps --no-audit --no-fund
        env:
          CI: "true"
      - name: Compile frontend
        run: npm run build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: "https://example.invalid"
