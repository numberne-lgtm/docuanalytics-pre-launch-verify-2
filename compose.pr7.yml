# Local machine ONLY. Synthetic data, no paid external services, no public ports.
services:
  mongo:
    image: mongo:7
    restart: "no"
    networks: [pr7_local]
    volumes: [pr7_mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 12
  staging:
    build:
      context: .
      dockerfile: backend/Dockerfile.pr7
    restart: "no"
    environment:
      APP_ENV: test
      PR7_LOCAL_STAGING: "1"
      STAGING_MONGO_URI: mongodb://mongo:27017
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [pr7_local]
networks:
  pr7_local:
    internal: true
volumes:
  pr7_mongo_data:
