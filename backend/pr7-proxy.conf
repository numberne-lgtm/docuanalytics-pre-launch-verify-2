# Local-only reverse proxy for the sealed PR7 staging network.
# No keys and no upstream other than the private staging service.
server {
  listen 8080;
  server_name localhost;
  access_log off;
  server_tokens off;
  client_max_body_size 14m;
  location / {
    proxy_pass http://staging:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For 127.0.0.1;
    proxy_read_timeout 30s;
  }
}
